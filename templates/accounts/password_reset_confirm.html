<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose new password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:520px"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h4">Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100" type="submit">Update password</button></form>{% else %}<p class="text-danger">This reset link is invalid or has expired.</p><a class="btn btn-outline-primary" href="{% url 'password_reset' %}">Request a new link</a>{% endif %}</div></div></main></body></html>
