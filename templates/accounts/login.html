<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>

body{

    background: #eef3f8;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    color:#14213d;
    font-family:'DM Sans', sans-serif;
}

.card{

    width:min(940px, 100%);
    border:none;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 24px 70px rgba(20,33,61,.16);
    background:#fff;
    display:grid;
    grid-template-columns:1fr 1fr;
}

.card-header{

    grid-column:1;
    grid-row:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:56px;
    background:#14213d;
    color:white;
    text-align:left;
    font-family:'Space Grotesk', sans-serif;
    font-size:32px;
    font-weight:700;
    line-height:1.1;
}

.card-header::before{
    content:'EVENTS / ATTENDANCE / COMMUNITY';
    display:block;
    margin-bottom:24px;
    color:#7dd3fc;
    font-family:'DM Sans', sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.8px;
}

.card-header::after{
    content:'Your next event starts here.';
    display:block;
    max-width:260px;
    margin-top:18px;
    color:#c9d5e8;
    font-family:'DM Sans', sans-serif;
    font-size:15px;
    font-weight:400;
    line-height:1.6;
}

.card-body{
    grid-column:2;
    grid-row:1;
    padding:56px;
}

.card-body::before{
    content:'Welcome back';
    display:block;
    margin-bottom:6px;
    color:#14213d;
    font-family:'Space Grotesk', sans-serif;
    font-size:27px;
    font-weight:700;
}

.card-body::after{
    content:'Sign in to manage your events and registrations.';
    display:block;
    margin-bottom:28px;
    color:#68758a;
    font-size:14px;
}

.btn-primary{

    width:100%;
    border:0;
    padding:12px 16px;
    border-radius:10px;
    background:#0d6efd;
    font-weight:600;
    transition:transform .2s ease, box-shadow .2s ease;
}

.btn-primary:hover{
    background:#0b5ed7;
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(13,110,253,.25);
}

.logo{

    display:none;
}

.form-label{
    color:#34445e;
    font-size:13px;
    font-weight:600;
}

.form-control{
    min-height:48px;
    border:1px solid #d6deea;
    border-radius:10px;
    padding:12px 14px;
}

.form-control:focus{
    border-color:#0d6efd;
    box-shadow:0 0 0 .2rem rgba(13,110,253,.12);
}

.register-link{
    color:#0d6efd;
    font-weight:600;
    text-decoration:none;
}

.register-link:hover{
    text-decoration:underline;
}

@media (max-width:700px){
    body{padding:14px;}
    .card{display:block; border-radius:16px;}
    .card-header{padding:32px 28px; font-size:26px;}
    .card-body{padding:32px 28px;}
}

@media (prefers-reduced-motion:reduce){
    .btn-primary{transition:none;}
    .btn-primary:hover{transform:none;}
}

</style>

</head>

<body>

<div class="card">

<div class="card-header">

Event Registration System

</div>

<div class="card-body">

<div class="logo">
</div>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">Username</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required>

</div>

<div class="mb-3">

<label class="form-label">Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<button class="btn btn-primary">

Login

</button>

<a class="d-block text-center small mt-3 text-decoration-none" href="{% url 'password_reset' %}">Forgot your password?</a>

<hr>

<p class="text-center text-muted small mb-0">

Don't have an account?

<a class="register-link" href="{% url 'signup' %}">

Register Here

</a>

</p>

</form>

</div>

</div>

</body>

</html>
