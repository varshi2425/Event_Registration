<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset Password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:520px"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h4">Reset your password</h1><p class="text-muted">Enter your account email and we will send reset instructions.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100" type="submit">Send reset link</button></form></div></div></main></body>
</html>
