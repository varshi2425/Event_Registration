{% extends "admin/admin_dashboard.html" %}
{% load static %}

{% block content %}

<style>

.custom-card{
    max-width:420px;
    margin:40px auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    padding:30px;
}

.custom-card h3{
    font-size:24px;
    font-weight:700;
    margin-bottom:25px;
}

.form-label{
    font-weight:600;
    margin-bottom:8px;
}

.form-text{
    font-size:13px;
    color:#888;
    margin-bottom:10px;
}

/* Inputs */

.custom-card input[type="text"],
.custom-card select{
    width:100%;
    border-radius:10px;
    border:1px solid #ddd;
    padding:10px 15px;
    margin-bottom:20px;
}

/* Theme Buttons */

.theme-box{
    display:flex;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
}

.theme-box label{
    flex:1;
    text-align:center;
    padding:10px;
    cursor:pointer;
    margin:0;
    font-weight:600;
}

.theme-box input{
    display:none;
}

.theme-box input:checked + label{
    background:#283593;
    color:white;
}

/* Color Picker */

.color-row{
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.color-row input[type="radio"]{
    display:none;
}

.color-row label{
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    border:3px solid transparent;
}

.color-row input:checked + label{
    border-color:#000;
    transform:scale(1.08);
}

/* Font Buttons */

.font-box{
    display:flex;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:30px;
}

.font-box label{
    flex:1;
    text-align:center;
    padding:10px;
    cursor:pointer;
    margin:0;
    font-weight:600;
}

.font-box input{
    display:none;
}

.font-box input:checked + label{
    background:#283593;
    color:white;
}

/* Save Button */

.save-btn{
    width:100%;
    background:#006699;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px;
    font-weight:600;
    transition:.3s;
}

.save-btn:hover{
    background:#00557a;
}

</style>

<div class="custom-card">

    <h3>Dashboard Customization</h3>

    <form method="POST">

        {% csrf_token %}

        <!-- Dashboard Title -->

        <label class="form-label">
            Dashboard Title
        </label>

        {{ form.dashboard_title }}

        <!-- Theme -->

        <label class="form-label">
            Theme
        </label>

        <div class="theme-box">

            <input
                type="radio"
                name="theme"
                id="light"
                value="light"
                {% if form.theme.value == "light" %}checked{% endif %}>

            <label for="light">
                Light
            </label>

            <input
                type="radio"
                name="theme"
                id="dark"
                value="dark"
                {% if form.theme.value == "dark" %}checked{% endif %}>

            <label for="dark">
                Dark
            </label>

        </div>

        <!-- Sidebar Color -->

        <label class="form-label">
            Sidebar Color
        </label>

        <div class="color-row">

            <input type="radio"
                   name="sidebar_color"
                   id="c1"
                   value="#1E88E5"
                   {% if form.sidebar_color.value == "#1E88E5" %}checked{% endif %}>
            <label for="c1" style="background:#1E88E5;"></label>

            <input type="radio"
                   name="sidebar_color"
                   id="c2"
                   value="#5E35B1"
                   {% if form.sidebar_color.value == "#5E35B1" %}checked{% endif %}>
            <label for="c2" style="background:#5E35B1;"></label>

            <input type="radio"
                   name="sidebar_color"
                   id="c3"
                   value="#00897B"
                   {% if form.sidebar_color.value == "#00897B" %}checked{% endif %}>
            <label for="c3" style="background:#00897B;"></label>

            <input type="radio"
                   name="sidebar_color"
                   id="c4"
                   value="#2E7D32"
                   {% if form.sidebar_color.value == "#2E7D32" %}checked{% endif %}>
            <label for="c4" style="background:#2E7D32;"></label>

        </div>

        <!-- Font Size -->

        <label class="form-label">
            Font Size
        </label>

        <div class="font-box">

            <input
                type="radio"
                name="font_size"
                id="small"
                value="small"
                {% if form.font_size.value == "small" %}checked{% endif %}>

            <label for="small">
                Small
            </label>

            <input
                type="radio"
                name="font_size"
                id="medium"
                value="medium"
                {% if form.font_size.value == "medium" %}checked{% endif %}>

            <label for="medium">
                Medium
            </label>

            <input
                type="radio"
                name="font_size"
                id="large"
                value="large"
                {% if form.font_size.value == "large" %}checked{% endif %}>

            <label for="large">
                Large
            </label>

        </div>

        <button class="save-btn">

            Save Customization

        </button>

    </form>

</div>

{% endblock %}
