<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: #f8f9fa;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:420px;
    border:none;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.card-header{
    background:#198754;
    color:white;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-radius:15px 15px 0 0;
}

.logo{
    font-size:60px;
    text-align:center;
    margin:20px 0;
}

.btn-success{
    width:100%;
}

</style>

</head>

<body>

<div class="card">

<div class="card-header">
Create Account
</div>

<div class="card-body">

<div class="logo">
🎉
</div>

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">Username</label>
<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>
</div>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<button type="submit" class="btn btn-success">
Create Account
</button>

<hr>

<p class="text-center mb-0">
Already have an account?
<a href="{% url 'login' %}">
Login Here
</a>
</p>

</form>

</div>

</div>

</body>

</html>
