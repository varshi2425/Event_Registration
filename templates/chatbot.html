<style>
.chatbot-toggle {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 1050;
    width: 52px;
    height: 52px;
    border: 0;
    border-radius: 50%;
    background: #0d6efd;
    color: #fff;
    box-shadow: 0 8px 20px rgba(13, 110, 253, .3);
}

.chatbot-panel {
    position: fixed;
    right: 24px;
    bottom: 88px;
    z-index: 1050;
    display: none;
    width: min(360px, calc(100vw - 32px));
    overflow: hidden;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 12px 35px rgba(0, 0, 0, .2);
}

.chatbot-panel.open {
    display: block;
}

.chatbot-header {
    padding: 14px 16px;
    background: #0d6efd;
    color: #fff;
}

.chatbot-messages {
    height: 240px;
    overflow-y: auto;
    padding: 14px;
    background: #f8f9fa;
}

.chatbot-message {
    max-width: 90%;
    margin-bottom: 10px;
    padding: 9px 11px;
    border-radius: 10px;
    font-size: .92rem;
}

.chatbot-message.bot {
    background: #e9ecef;
}

.chatbot-message.user {
    margin-left: auto;
    background: #0d6efd;
    color: #fff;
}
</style>

<button class="chatbot-toggle" id="chatbotToggle" type="button" aria-label="Open help chatbot" title="Open Event Help Chatbot">
    <i class="bi bi-chat-dots-fill"></i>
</button>

<section class="chatbot-panel" id="chatbotPanel" aria-label="Help chatbot">
    <div class="chatbot-header">
        <strong>Event Help</strong>
        <div class="small">Ask about registration, events, QR check-in, or support.</div>
    </div>
    <div class="chatbot-messages" id="chatbotMessages">
        <div class="chatbot-message bot">How can I help?</div>
    </div>
    <form class="d-flex gap-2 p-3" id="chatbotForm">
        {% csrf_token %}
        <input class="form-control" id="chatbotInput" type="text" placeholder="Ask a question..." autocomplete="off" required>
        <button class="btn btn-primary" type="submit" aria-label="Send message">
            <i class="bi bi-send-fill"></i>
        </button>
    </form>
</section>

<script>
(function () {
    const toggle = document.getElementById("chatbotToggle");
    const panel = document.getElementById("chatbotPanel");
    const form = document.getElementById("chatbotForm");
    const input = document.getElementById("chatbotInput");
    const messages = document.getElementById("chatbotMessages");

    toggle.addEventListener("click", function () {
        panel.classList.toggle("open");
        if (panel.classList.contains("open")) input.focus();
    });

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        messages.insertAdjacentHTML("beforeend", `<div class="chatbot-message user"></div>`);
        messages.lastElementChild.textContent = message;
        input.value = "";

        const response = await fetch("{% url 'chatbot_reply' %}", {
            method: "POST",
            headers: { "X-CSRFToken": form.querySelector("[name=csrfmiddlewaretoken]").value },
            body: new URLSearchParams({ message: message })
        });
        const data = await response.json();
        messages.insertAdjacentHTML("beforeend", `<div class="chatbot-message bot"></div>`);
        messages.lastElementChild.textContent = data.reply || "Please try again.";
        messages.scrollTop = messages.scrollHeight;
    });
})();
</script>
