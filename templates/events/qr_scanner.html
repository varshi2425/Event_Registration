<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"
            type="text/javascript">
    </script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 30px;
        }

        .scanner-container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        #reader {
            width: 100%;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .scanner-controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, a {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        input[type="file"] {
            width: 100%;
            border: 1px solid #d1d5db;
            background: #f9fafb;
        }

        .file-help {
            color: #4b5563;
            font-size: 14px;
            margin: 0;
        }

        a {
            align-self: center;
            background: #e5e7eb;
            color: #1f2937;
        }

        #reader {
            min-height: 1px;
        }

        #scan-preview {
            display: none;
            max-width: 100%;
            max-height: 280px;
            margin: 15px auto 0;
        }

        #scan-file {
            background: #2563eb;
            color: white;
        }

    </style>

</head>


<body>

<div class="scanner-container">

    <h1>QR Scanner</h1>

    <p class="description">
        Scan a registered member's QR code
    </p>

    <div class="scanner-controls">
        <p class="file-help">Upload a saved QR code image from your laptop to check in the member.</p>
        <input id="scan-file" type="file" accept="image/png,image/jpeg,image/webp">
        <a href="{% url 'admin_dashboard' %}">Dashboard</a>
    </div>

    <div id="reader"></div>
    <img id="scan-preview" alt="Selected QR code preview">

    <div id="result"></div>

</div>


<script>

function showResult(message, type) {

    const result = document.getElementById("result");

    result.innerHTML = message;

    result.className = type;

    result.style.display = "block";
}


function onScanSuccess(decodedText, decodedResult) {

    console.log("QR Code:", decodedText);

    showResult(
        "QR code detected. Processing...",
        "success"
    );
    try {
        const scannedUrl = new URL(decodedText, window.location.origin);
        const checkInPathPattern = /^\/events\/check-in\/\d+\/[0-9a-f-]+\/$/i;

        if (!checkInPathPattern.test(scannedUrl.pathname)) {
            throw new Error("Unexpected QR destination");
        }

        window.location.href = `${window.location.origin}${scannedUrl.pathname}`;
    } catch (error) {
        showResult(
            "This is not a valid attendee check-in QR code.",
            "error"
        );
    }

}
    

function onScanFailure(error) {

    // Ignore continuous scanning errors.
}


const scanFileInput = document.getElementById("scan-file");
const scanPreview = document.getElementById("scan-preview");

scanFileInput.addEventListener("change", async function () {
    const file = scanFileInput.files[0];

    if (!file) {
        return;
    }

    scanPreview.src = URL.createObjectURL(file);
    scanPreview.style.display = "block";
    showResult("Reading QR code image...", "success");

    try {
        const scanner = new Html5Qrcode("reader");
        const decodedText = await scanner.scanFile(file, false);
        scanner.clear();
        onScanSuccess(decodedText);
    } catch (error) {
        showResult(
            "No valid QR code was found in that image. Upload a clear member QR code and try again.",
            "error"
        );
        console.error("Unable to read QR image:", error);
    } finally {
        scanFileInput.value = "";
    }
});

</script>

</body>

</html>
