<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-qr-code-scan me-2"></i>QR Scanner</h1>
            <p class="text-muted mb-0">Choose an active event before scanning attendance.</p>
        </div>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Dashboard
        </a>
    </div>

    <div class="row g-3">
        {% for event in events %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <span class="badge text-bg-primary mb-2">{{ event.status }}</span>
                    <h2 class="h5">{{ event.event_name }}</h2>
                    <p class="text-muted mb-1"><i class="bi bi-geo-alt me-1"></i>{{ event.venue }}</p>
                    <p class="text-muted">{{ event.start_date|date:"d M Y" }}</p>
                    <a href="{% url 'qr_scanner' event.id %}" class="btn btn-success w-100">
                        <i class="bi bi-camera me-1"></i>Scan This Event
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-info">There are no active events available for scanning.</div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
