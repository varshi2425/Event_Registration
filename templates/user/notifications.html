<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h1 class="h3 mb-1"><i class="bi bi-bell-fill me-2"></i>All Notifications</h1><p class="text-muted mb-0">Updates about events and your account.</p></div>
        <a href="{% url 'user_dashboard' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Dashboard</a>
    </div>
    <div class="card border-0 shadow-sm"><div class="card-body">
        {% for notification in notifications %}
            <div class="border-bottom py-3"><div class="d-flex justify-content-between gap-3"><strong>{{ notification.title }}</strong><small class="text-muted">{{ notification.created_at|date:"d M Y, h:i A" }}</small></div><p class="mb-0 mt-1">{{ notification.message }}</p></div>
        {% empty %}
            <div class="text-center text-muted py-5"><i class="bi bi-bell-slash fs-1"></i><p class="mt-3 mb-0">No notifications found.</p></div>
        {% endfor %}
    </div></div>
</div>
{% include 'chatbot.html' %}
</body>
</html>
