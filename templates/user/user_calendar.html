<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monthly Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; }
        .calendar-page { max-width: 1200px; }
        .dark-theme { background: #212529; color: #f8f9fa; }
        .dark-theme .card { background: #343a40; color: #f8f9fa; }
    </style>
</head>
<body class="{% if customization.theme == 'dark' %}dark-theme{% endif %}">
<div class="container calendar-page py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-calendar3 me-2"></i>Monthly Calendar</h1>
            <p class="text-muted mb-0">Select an event on the calendar to view its details.</p>
        </div>
        <a href="{% url 'user_dashboard' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Dashboard</a>
    </div>
    <div class="card border-0 shadow-sm"><div class="card-body"><div id="userCalendar"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const calendar = new FullCalendar.Calendar(document.getElementById("userCalendar"), {
            initialView: "dayGridMonth",
            height: "auto",
            events: {{ calendar_events|safe }}
        });
        calendar.render();
    });
</script>
{% include 'chatbot.html' %}
</body>
</html>
