<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}Event Registration{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f8f9fa;
}

.sidebar{

    width:250px;
    min-height:100vh;
    background:#212529;
    position:fixed;
    left:0;
    top:0;
    color:white;
}

.sidebar h3{

    padding:20px;
    text-align:center;
}

.sidebar a{

    display:block;
    color:white;
    padding:15px 20px;
    text-decoration:none;
}

.sidebar a:hover{

    background:#0d6efd;
}

.content{

    margin-left:260px;
    padding:30px;
}

.card{

    border:none;
}

</style>

</head>

<body>

<div class="sidebar">

<h3>🎉 Event System</h3>

<a href="{% url 'admin_dashboard' %}">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>

<a href="{% url 'category_list' %}">
<i class="bi bi-folder"></i>
Categories
</a>

<a href="{% url 'event_list' %}">
<i class="bi bi-calendar-event"></i>
Events
</a>

{% if not request.user.is_staff %}
<a href="{% url 'wishlist' %}">
<i class="bi bi-heart"></i>
Wishlist
</a>
{% endif %}

<a href="{% url 'member_list' %}">
<i class="bi bi-people"></i>
Members
</a>

<a href="{% url 'logout' %}">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>

</div>

<div class="content">

{% block content %}

{% endblock %}

</div>

</body>

</html>
